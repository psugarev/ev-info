name: IoniqDrive

options:
  bundleIdPrefix: com.evinfo
  deploymentTarget:
    iOS: "17.6"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_TESTABILITY: YES
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

targets:
  IoniqDrive:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Sources
        excludes:
          - "CarPlay/README.md"
      - path: Resources
        excludes:
          - "Info.plist"
          - "IoniqDrive.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evinfo.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_ENTITLEMENTS: Resources/IoniqDrive.entitlements
        DEVELOPMENT_TEAM: Z9FRWWUQBT
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only for v1: there is no iPad layout yet. Change to "1,2" only
        # together with an iPad-verified UI and iPad App Store screenshots.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: EVInfo
        CFBundleDisplayName: EV Info
        CFBundleIdentifier: com.evinfo.app
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - bg
        LSRequiresIPhoneOS: true
        # No custom or non-exempt encryption is used; avoids the export
        # compliance prompt on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: "EV Info connects to your ELM327-compatible OBD2 Bluetooth adapter (for example vLinker iCar Pro) to read battery, charging and trip data. All data stays on your iPhone."
        NSLocationWhenInUseUsageDescription: "EV Info uses your location while recording a trip to measure distance, speed and route when the car does not report them over OBD2."
        # Only Bluetooth keeps running in the background. Trip GPS is recorded
        # in the foreground; add `location` back only after background trip
        # logging is validated on device (Guideline 2.5.4).
        UIBackgroundModes:
          - bluetooth-central

  IoniqDriveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Tests
    dependencies:
      - target: IoniqDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evinfo.tests
        INFOPLIST_FILE: ""
